<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مغامرة فاطمة العسل مع الحروف</title>
<style>
:root{--h:#f5a623;--d:#7a4a00;--c:#fff6d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Segoe UI',Tahoma,'Noto Naskh Arabic',sans-serif;background:linear-gradient(#ffe9a0,#ffd166 60%,#f9b44c);color:var(--d);overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg span{position:absolute;font-size:28px;opacity:.35;animation:fl 9s linear infinite}
@keyframes fl{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-10vh) rotate(360deg)}}
main{position:relative;z-index:1;max-width:860px;margin:auto;padding:14px 12px 70px;text-align:center}
h1{font-size:clamp(26px,6vw,44px);margin:6px 0;text-shadow:2px 2px #fff}
.sub{font-size:18px;margin:4px 0 14px}
.fat{font-size:70px;animation:bz 2s ease-in-out infinite;display:inline-block}
@keyframes bz{50%{transform:translateY(-10px) rotate(6deg)}}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px}
.lv{background:var(--c);border:4px solid var(--h);border-radius:24px;padding:12px;cursor:pointer;box-shadow:0 6px 0 #c27d0e;font-family:inherit;color:var(--d);transition:.15s}
.lv:hover{transform:translateY(-4px)}.lv:active{transform:translateY(3px);box-shadow:0 2px 0 #c27d0e}
.lv b{display:block;font-size:64px;line-height:1.2}
.lv small{font-size:15px}.st{font-size:20px;letter-spacing:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff8;border-radius:20px;padding:8px 12px;margin-bottom:10px;font-size:20px}
button.s{background:var(--h);border:0;border-radius:14px;padding:8px 14px;font:inherit;font-size:17px;color:#fff;cursor:pointer;box-shadow:0 4px 0 #c27d0e}
.track{position:relative;height:50px;background:#fff8;border-radius:25px;margin:6px 0 12px;border:3px dashed var(--h)}
.track .home{position:absolute;left:8px;top:2px;font-size:34px}
.track .bear{position:absolute;top:2px;font-size:36px;transition:right .6s;right:6px;transform:scaleX(-1)}
.q{font-size:20px;margin:6px 0}
.jars{display:flex;gap:14px;justify-content:center;margin:8px 0}
.jar{flex:1;max-width:320px;min-height:190px;background:var(--c);border:5px dashed var(--h);border-radius:28px 28px 50px 50px;padding:8px;transition:.2s}
.jar.over{background:#fff;transform:scale(1.04);border-style:solid}
.jar .L{font-size:70px;line-height:1;font-weight:bold}.jar .em{font-size:30px;min-height:40px}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#fff8;border-radius:24px;padding:12px;min-height:120px}
.card{width:100px;background:#fff;border:3px solid var(--h);border-radius:18px;padding:6px 4px;cursor:grab;touch-action:none;user-select:none;box-shadow:0 4px 0 #c27d0e;position:relative}
.card .e{font-size:48px;display:block}.card .w{font-size:19px;font-weight:bold}
.card.drag{z-index:50;cursor:grabbing;box-shadow:0 12px 20px #0005}
.card.no{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.chip{display:inline-block;background:#fff;border-radius:12px;padding:2px 8px;margin:2px;font-size:19px;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
.opts{display:flex;gap:12px;justify-content:center;margin-top:12px}
.opt{width:92px;height:92px;font-size:56px;background:var(--c);border:4px solid var(--h);border-radius:22px;cursor:pointer;font-family:inherit;color:var(--d)}
.opt.ok{background:#9be28f}.opt.bad{background:#ff9d9d}
.big{font-size:90px;margin:0}
.fx{position:fixed;font-size:30px;pointer-events:none;z-index:99;animation:up 1s forwards}
@keyframes up{to{transform:translateY(-120px) scale(1.6);opacity:0}}
footer{position:fixed;bottom:0;left:0;right:0;text-align:center;background:#7a4a00;color:#ffe9a0;padding:6px;font-size:14px;z-index:5}
.hid{display:none}
@media(max-width:520px){.card{width:84px}.card .e{font-size:40px}.jar .L{font-size:56px}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<main>
<section id="menu">
  <div class="fat">👧🐝</div>
  <h1>🍯 مغامرة فاطمة العسل مع الحروف 🍯</h1>
  <p class="sub">الدبّ الجائع يريد عسل فاطمة! ساعدها في ترتيب الكلمات في الجرار الصحيحة قبل أن يصل الدبّ 🐻<br>اختاري أي مرحلة تحبين أن تبدئي بها:</p>
  <div class="menu" id="lvls"></div>
</section>

<section id="game" class="hid">
  <div class="bar">
    <button class="s" onclick="home()">🏠 القائمة</button>
    <span id="hud"></span>
    <button class="s" id="mute" onclick="toggleSound()">🔊</button>
  </div>
  <div class="track"><span class="home">🏡</span><span class="bear" id="bear">🐻</span></div>
  <div id="stage"></div>
</section>
</main>
<footer>Created by T. Badria Alfalahi</footer>

<script>
const DATA={
'ج':[['جمل','🐪'],['جزر','🥕'],['جبل','⛰️'],['جرس','🔔'],['جبن','🧀'],['جوال','📱']],
'ح':[['حصان','🐴'],['حوت','🐋'],['حليب','🥛'],['حلزون','🐌'],['حذاء','👟'],['حقيبة','🎒']],
'خ':[['خروف','🐑'],['خيمة','⛺'],['خبز','🍞'],['خيار','🥒'],['خاتم','💍'],['خوخ','🍑']],
'د':[['دجاجة','🐔'],['دبّ','🐻'],['دراجة','🚲'],['دلو','🪣'],['دفتر','📓'],['دولفين','🐬']],
'ذ':[['ذرة','🌽'],['ذئب','🐺'],['ذبابة','🪰'],['ذهب','🪙'],['ذراع','💪']]
};
const PAIR={'ج':'ح','ح':'خ','خ':'ج','د':'ذ','ذ':'د'};
const NAMES={'ج':'جيم','ح':'حاء','خ':'خاء','د':'دال','ذ':'ذال'};
const ALL=Object.keys(DATA);
const sh=a=>[...a].sort(()=>Math.random()-.5);
let sound=true,stars={},S={};
try{stars=JSON.parse(localStorage.getItem('fatimaStars')||'{}')}catch(e){}
const $=id=>document.getElementById(id);

/* ===== sounds ===== */
let ac;
function tone(f,t=.15,type='sine',d=0){
  if(!sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  o.connect(g);g.connect(ac.destination);const s=ac.currentTime+d;
  g.gain.setValueAtTime(.25,s);g.gain.exponentialRampToValueAtTime(.001,s+t);o.start(s);o.stop(s+t)}catch(e){}
}
const good=()=>[523,659,784].forEach((f,i)=>tone(f,.18,'triangle',i*.1));
const bad=()=>{tone(220,.25,'sawtooth');tone(160,.3,'sawtooth',.15)};
const win=()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,'triangle',i*.12));
function say(t){
  if(!sound||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.85;speechSynthesis.speak(u)}catch(e){}
}
function toggleSound(){sound=!sound;$('mute').textContent=sound?'🔊':'🔇';if(!sound&&window.speechSynthesis)speechSynthesis.cancel()}
function fx(e,x,y){const s=document.createElement('div');s.className='fx';s.textContent=e;s.style.left=x+'px';s.style.top=y+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}
function burst(x,y,arr=['⭐','🍯','✨','🐝']){for(let i=0;i<6;i++)setTimeout(()=>fx(arr[i%arr.length],x+(Math.random()*80-40),y+(Math.random()*40-20)),i*60)}

/* ===== background ===== */
(function(){const b=$('bg');['🐝','🍯','🌼','🐝','🌻','🍯','🌼','🐝'].forEach((e,i)=>{const s=document.createElement('span');s.textContent=e;s.style.left=(i*13+3)+'%';s.style.animationDelay=(-i*1.4)+'s';s.style.animationDuration=(8+i)+'s';b.appendChild(s)})})();

/* ===== menu ===== */
function buildMenu(){
  $('lvls').innerHTML=ALL.map((l,i)=>{const n=stars[l]||0;
    return `<button class="lv" onclick="start('${l}')"><b>${l}</b><small>المرحلة ${i+1} • ${NAMES[l]}</small><div class="st">${'⭐'.repeat(n)+'☆'.repeat(3-n)}</div></button>`}).join('');
}
function home(){speechSynthesis&&speechSynthesis.cancel();$('game').classList.add('hid');$('menu').classList.remove('hid');buildMenu();window.scrollTo(0,0)}
buildMenu();

/* ===== game ===== */
function start(l){
  const mine=sh(DATA[l]).slice(0,3),other=sh(DATA[PAIR[l]]).slice(0,3);
  S={l,o:PAIR[l],items:sh([...mine.map(x=>({w:x[0],e:x[1],L:l})),...other.map(x=>({w:x[0],e:x[1],L:PAIR[l]}))]),
     lives:3,miss:0,placed:0,q:0,honey:0};
  $('menu').classList.add('hid');$('game').classList.remove('hid');
  setBear();drag1();say('حرف '+NAMES[l]);
}
function hud(){$('hud').innerHTML=`المرحلة: <b>${S.l}</b> &nbsp; ${'🍯'.repeat(S.honey)}${'▫️'.repeat(Math.max(0,8-S.honey))} &nbsp; ${'❤️'.repeat(S.lives)}`}
function setBear(){$('bear').style.right=(6+(3-S.lives)*(($('bear').parentNode.clientWidth-110)/3))+'px';hud()}

function drag1(){
  const order=sh([S.l,S.o]);
  $('stage').innerHTML=`<p class="q">🎯 اسحبي كل صورة إلى جرّة الحرف الذي تبدأ به كلمتها</p>
  <div class="jars">${order.map(L=>`<div class="jar" data-l="${L}"><div class="L">${L}</div><div class="em" id="em${L}"></div></div>`).join('')}</div>
  <div class="tray" id="tray">${S.items.map((it,i)=>`<div class="card" data-i="${i}"><span class="e">${it.e}</span><span class="w">${it.w}</span></div>`).join('')}</div>`;
  document.querySelectorAll('.card').forEach(c=>{
    let sx,sy;
    c.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId);c.classList.add('drag');say(S.items[c.dataset.i].w)};
    c.onpointermove=e=>{if(!c.classList.contains('drag'))return;c.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px) scale(1.1)`;
      document.querySelectorAll('.jar').forEach(j=>{const r=j.getBoundingClientRect();j.classList.toggle('over',e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)})};
    c.onpointerup=e=>{c.classList.remove('drag');let hit=null;
      document.querySelectorAll('.jar').forEach(j=>{const r=j.getBoundingClientRect();j.classList.remove('over');if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)hit=j});
      c.style.transform='';if(hit)drop(c,hit,e)};
  });
  hud();
}
function drop(c,jar,e){
  const it=S.items[c.dataset.i];
  if(jar.dataset.l===it.L){
    good();burst(e.clientX,e.clientY);S.placed++;S.honey++;
    $('em'+it.L).insertAdjacentHTML('beforeend',`<span class="chip">${it.e} ${it.w}</span>`);
    c.remove();say(it.w);hud();
    if(S.placed===6)setTimeout(quiz,800);
  }else{
    bad();c.classList.add('no');setTimeout(()=>c.classList.remove('no'),400);
    S.miss++;S.lives--;setBear();
    if(S.lives<=0)setTimeout(lose,600);
  }
}
function quiz(){
  const pool=sh(DATA[S.l]);const it=pool[0];
  const opts=sh([S.l,...sh(ALL.filter(x=>x!==S.l)).slice(0,2)]);
  $('stage').innerHTML=`<p class="q">🧠 سؤال ${S.q+1} من 2</p><p class="big">${it[1]}</p>
  <p class="q"><b>${it[0]}</b> — ما الحرف الأول في هذه الكلمة؟</p>
  <div class="opts">${opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>`;
  say('ما الحرف الأول في كلمة '+it[0]);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=e=>{
    if(b.dataset.o===S.l){b.classList.add('ok');good();burst(e.clientX,e.clientY);S.honey++;S.q++;hud();
      setTimeout(()=>S.q>=2?finish():quiz(),900)}
    else{b.classList.add('bad');bad();S.miss++;S.lives--;setBear();if(S.lives<=0)setTimeout(lose,600)}
  });
}
function finish(){
  const n=S.miss===0?3:S.miss<=2?2:1;
  stars[S.l]=Math.max(stars[S.l]||0,n);try{localStorage.setItem('fatimaStars',JSON.stringify(stars))}catch(e){}
  win();say('أحسنتِ يا فاطمة');burst(innerWidth/2,innerHeight/2,['🎉','⭐','🍯','🌟']);
  const next=ALL[(ALL.indexOf(S.l)+1)%ALL.length];
  $('stage').innerHTML=`<p class="big">🏆</p><h2>أحسنتِ يا فاطمة العسل!</h2>
  <p class="st" style="font-size:40px">${'⭐'.repeat(n)+'☆'.repeat(3-n)}</p>
  <p class="q">حافظتِ على العسل وتعلّمتِ حرف <b>${S.l}</b> 🍯🐝</p>
  <button class="s" onclick="start('${S.l}')">🔄 العبي مرة أخرى</button>
  <button class="s" onclick="start('${next}')">➡️ حرف ${next}</button>
  <button class="s" onclick="home()">🏠 القائمة</button>`;
}
function lose(){
  bad();say('حاولي مرة أخرى');
  $('stage').innerHTML=`<p class="big">🐻🍯</p><h2>وصل الدبّ إلى العسل!</h2>
  <p class="q">لا بأس يا فاطمة، التعلّم بالمحاولة. جرّبي مرة أخرى!</p>
  <button class="s" onclick="start('${S.l}')">🔄 حاولي مرة أخرى</button>
  <button class="s" onclick="home()">🏠 القائمة</button>`;
}
</script>
</body>
</html>
